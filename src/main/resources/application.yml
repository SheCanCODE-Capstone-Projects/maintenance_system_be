spring:
  application:
    name: MaintenainceHub

  profiles:
    active: local  # Loads application-local.yml which holds real credentials (gitignored)

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/db}
    username: ${DB_USERNAME:changeme}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  cache:
    type: simple

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:changeme}
    password: ${MAIL_PASSWORD:changeme}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:DISABLED}
            client-secret: ${GOOGLE_CLIENT_SECRET:DISABLED}
            scope: email, profile

app:
  jwt:
    secret: ${JWT_SECRET:changeme-use-local-profile}
    expiration: ${JWT_EXPIRATION:86400000}
  upload:
    dir: uploads/prescriptions
  email:
    from: noreply@hospital.com

logging:
  level:
    org.springframework.security: WARN
    org.example: DEBUG

mail:
  port:578

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
  show-actuator: false

