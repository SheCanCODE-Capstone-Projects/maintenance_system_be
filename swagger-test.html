<!DOCTYPE html>
<html>
<head>
    <title>Swagger UI Test</title>
</head>
<body>
    <h1>Testing Swagger UI Paths</h1>
    <ul>
        <li><a href="http://localhost:8080/swagger-ui/index.html" target="_blank">Try /swagger-ui/index.html</a></li>
        <li><a href="http://localhost:8080/swagger-ui.html" target="_blank">Try /swagger-ui.html</a></li>
        <li><a href="http://localhost:8080/v3/api-docs" target="_blank">Try /v3/api-docs (Should work)</a></li>
        <li><a href="http://localhost:8080/api/auth/register" target="_blank">Try /api/auth/register (POST endpoint)</a></li>
    </ul>
    
    <h2>Direct Test</h2>
    <button onclick="testRegistration()">Test Registration API</button>
    <pre id="result"></pre>
    
    <script>
        function testRegistration() {
            fetch('http://localhost:8080/api/auth/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    name: 'Test User',
                    email: 'test' + Date.now() + '@example.com',
                    phoneNumber: '+25078' + Math.floor(Math.random() * 10000000),
                    password: 'TestPass123',
                    role: 'CUSTOMER'
                })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('result').textContent = JSON.stringify(data, null, 2);
            })
            .catch(error => {
                document.getElementById('result').textContent = 'Error: ' + error;
            });
        }
    </script>
</body>
</html>
